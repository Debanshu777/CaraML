name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: JVM verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # CaraML builds only the two top-level native engines. Historical
          # nested stable-diffusion dependencies are optional and not part of
          # the production CMake graph.
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Run project verification
        run: ./gradlew verifyProject --stacktrace

  android:
    name: Android application
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned Android CMake
        run: |
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK root is unavailable}}"
          "${android_sdk}/cmdline-tools/latest/bin/sdkmanager" --install "cmake;3.31.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Assemble Android application and both supported ABIs
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

  desktop-artifact-fs:
    name: Desktop artifact filesystem (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Compile and assert the native filesystem runtime
        run: ./gradlew :nativeEngine:verifyArtifactFsDesktopLibrary --stacktrace

      - name: Verify packaged native filesystem and recovery
        run: ./gradlew :composeApp:packageDistributionForCurrentOS :composeApp:artifactFsInstalledImageSmoke :huggingFaceManager:jvmTest --stacktrace

  native-preflight-linux:
    name: Native preflight parity (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Verify fixtures and native parity
        env:
          CARAML_NATIVE_PARITY: "true"
        run: ./gradlew :nativeEngine:verifyNativePreflightFixtures :nativeEngine:compileLlamaRunnerDesktop :runner:jvmTest :diffusionRunner:jvmTest --no-daemon --max-workers=1 --stacktrace

  native-preflight-macos:
    name: Native preflight compilation (macOS/iOS)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Compile iOS native preflight integration
        run: ./gradlew :nativeEngine:compileLlamaRunnerCMakeIosSimulatorArm64 :composeApp:compileKotlinIosSimulatorArm64 --no-daemon --max-workers=1 --stacktrace

  recommendation-performance:
    name: Recommendation performance (pinned runner)
    if: ${{ vars.CARAML_BENCHMARK_RUNNER == 'enabled' && github.event_name != 'pull_request' }}
    runs-on: [self-hosted, caraml-benchmark]
    timeout-minutes: 20
    env:
      CARAML_ENFORCE_RECOMMENDATION_PERF: "true"
      CARAML_BENCHMARK_RUNNER_ID: "caraml-benchmark-v1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Enforce recommendation latency budgets
        run: ./gradlew :composeApp:jvmTest --tests '*RecommendationPerformanceTest*' --no-daemon --max-workers=1 --stacktrace
